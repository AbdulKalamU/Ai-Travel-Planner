# Production Configuration Profile

# Database Connection (Configured via environment variables in prod)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres.rnbniopvrkpiaenlxwcz}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:AiTineraryAdmin2026}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

# Logging
logging.level.root=WARN
logging.level.com.aitinerary=INFO

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://ai-tinerary-iota.vercel.app,https://travelplanner-ai.vercel.app,https://travelplanner.ai.vercel.app,https://ai-travelplan.vercel.app,http://localhost:5173}
